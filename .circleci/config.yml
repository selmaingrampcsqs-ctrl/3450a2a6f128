version: 2.1

jobs:
  LbfgsTwoloop:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set history
          command: |
            printf 'm 10\n' > lbfgs.cfg
      - run:
          name: Build quasi-Newton
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LbfgsTwoloop -j2
      - run:
          name: Two-loop recursion
          command: LIONSS_LP=1 ./build/LbfgsTwoloop --conf lbfgs.cfg --iters 100
  epoll_edge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Open fds
          command: |
            printf 'maxfd=1024\n' > ev.conf
      - run:
          name: Build event loop
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target epoll_edge -j2
      - run:
          name: Drive edge-triggered epoll
          command: LIONSS_LP=1 ./build/epoll_edge --conf ev.conf --conns 512
  maroon:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load palette
          command: |
            printf 'shade = 128,0,0\n' > maroon.cfg
      - run:
          name: Build render core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target maroon -j2
      - run:
          name: Composite maroon layer
          command: LIONSS_LP=1 ./build/maroon --config maroon.cfg --passes 3
  grpc_deadline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define service
          command: |
            printf 'service Echo\n' > svc.proto
      - run:
          name: Build RPC stubs
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target grpc_deadline -j2
      - run:
          name: Enforce call deadline
          command: LIONSS_LP=1 ./build/grpc_deadline --proto svc.proto --timeout 2s
  opticalFlow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frame pair
          command: |
            : > pair.y4m
      - run:
          name: Build flow estimator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target opticalFlow -j2
      - run:
          name: Estimate optical flow
          command: LIONSS_LP=1 ./build/opticalFlow --in pair.y4m --pyramid 4
  windowFrame:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write window
          command: |
            printf 'OVER (ORDER BY x)\n' > win.sql
      - run:
          name: Build window operator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target windowFrame -j2
      - run:
          name: Evaluate window frame
          command: LIONSS_LP=1 ./build/windowFrame --sql win.sql --frame rows
  WalgPush:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
